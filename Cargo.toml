[package]
name = "studfinder"
version = "0.1.0"
edition = "2021"
description = "Vision-based LEGO piece identification and cataloging tool"
license = "MIT"
repository = "https://github.com/pblittle/studfinder"
readme = "README.md"
keywords = ["lego", "computer-vision", "cli", "inventory", "cataloging"]
categories = ["command-line-utilities", "computer-vision"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
image = "0.24"
rusqlite = { version = "0.30", features = ["bundled"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
directories = "5.0"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.0"
test-case = "3.1"
predicates = "3.0"

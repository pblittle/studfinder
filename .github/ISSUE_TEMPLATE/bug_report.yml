name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ studfinder scan brick.jpg
        ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `studfinder --version`, or the commit you built from.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.1 (arm64), Ubuntu 24.04, ...
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: Image details
      description: >
        If a specific image triggers this, its dimensions, format, and dominant
        colour are usually more useful than the file itself.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from re-running the command with `--verbose`.
      render: shell
    validations:
      required: false
